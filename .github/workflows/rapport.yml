# Publiserer nettleserappen på GitHub Pages.
#
# All utregning skjer i nettleseren på telefonen (se IPHONE.md, metode 2):
# timene sendes i #data=… i lenken, som aldri når serveren. Ingenting lagres
# i repoet. Denne workflowen kopierer bare de statiske filene til Pages.
#
# Slå på Settings -> Pages -> Source: GitHub Actions før første kjøring.

name: Timeregnskap

on:
  push:
    branches: [main]
    paths: ["nettleser/**", ".github/workflows/rapport.yml"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: timeregnskap
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Legg appen på både roten og /app/
        run: |
          mkdir -p side/app
          cp -r nettleser/. side/
          cp -r nettleser/. side/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: side

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
